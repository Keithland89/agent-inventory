<rect x="32" y="862" width="2160" height="128" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="1112" y="896" font-size="18" font-weight="600" fill="#107C10" text-anchor="middle">POWER BI SEMANTIC MODEL</text>
<text x="1112" y="927" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">21 tables · 166 measures · Import · risk score derived in M</text>
<text x="1112" y="948" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Connects to Azure Resource Graph, Dataverse and Defender advanced hunting</text>
<text x="1112" y="969" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Scheduled refresh in PowerBI.com — no gateway, no local files</text>
<line x1="1112" y1="994" x2="1112" y2="1046" stroke="#0c8599" stroke-width="2" marker-end="url(#h0c8599)"/>
<rect x="32" y="1052" width="2160" height="128" rx="10" fill="#99e9f2" stroke="#0c8599" stroke-width="2"/>
<text x="1112" y="1086" font-size="18" font-weight="600" fill="#0c8599" text-anchor="middle">REPORT · 16 pages · 287 visuals</text>
<text x="1112" y="1117" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Executive overview · All agents · Agent analytics · Agent inventory · Creators &amp; ownership</text>
<text x="1112" y="1138" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Usage &amp; popularity · Copilot interactions · SharePoint agents · Adoption &amp; activity · Governance &amp; risk</text>
<text x="1112" y="1159" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Tools &amp; integration · Knowledge &amp; grounding · Knowledge sources · Azure AI Foundry · Data sources &amp; gaps · Shadow AI (endpoints)</text>
<rect x="32" y="1206" width="2160" height="272" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text x="1112" y="1240" font-size="18" font-weight="600" fill="#495057" text-anchor="middle">HOW EACH LANE REACHES THE MODEL — AND WHY C, D AND E COLLECT OUT OF BAND</text>
<text x="1112" y="1271" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Lane C — CopilotInteraction telemetry comes from the asynchronous Purview audit API and lands in Dataverse.</text>
<text x="1112" y="1297" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Lane D — named knowledge lives in each environment; application users collect it into one tenant-wide Dataverse table.</text>
<text x="1112" y="1323" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Lane E — SharePointAgentLogging reconstructs observed .agent inventory from sharePointFileOperation audit records.</text>
<text x="1112" y="1349" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Its stable ListItemUniqueId decodes from each SPO_* identity, joining SharePoint inventory to Copilot interactions at item level.</text>
<text x="1112" y="1375" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Power BI reads those three landing-table lanes from Dataverse; it never calls their POST-only or tenant-fan-out collection paths.</text>
<text x="1112" y="1401" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Lane F — Defender advanced hunting uses one fixed host, so Power BI queries it directly at refresh time and fails soft when unavailable.</text>
<text x="1112" y="1427" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Both PBIP builds contain the same pages and tables: pbip-cloud reads live services; pbip reads equivalent CSV shapes, including DimSharePointAgent.</text>
</svg>
