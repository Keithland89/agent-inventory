<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Agent Inventory installer</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="top">
  <img src="/icon.svg" alt="" width="32" height="32">
  <div>
    <h1>Agent Inventory installer</h1>
    <p class="muted">Nothing changes until you approve the plan. The broad grants ask again on their own.</p>
  </div>
  <button id="quit" class="quiet" type="button">Close the installer</button>
</header>
<main>
  <section id="home" class="card" aria-labelledby="home-title">
    <h2 id="home-title">What do you want to do?</h2>
    <div id="commands" class="commands"></div>
  </section>
  <section id="question" class="card question" aria-live="polite" hidden></section>
  <section id="feed" class="feed" aria-label="Progress"></section>
</main>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p class="noscript">The installer needs JavaScript. Or run it in the terminal without --ui.</p></noscript>
</body>
</html>
